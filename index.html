<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>社費系統</title>
<style>
:root{
  --bg:#07070a; --panel:#0f0f14; --panel2:#16161d; --line:#26262f;
  --gold:#e8b44c; --golddim:#7d5f22; --txt:#e6e6ec; --dim:#797986;
  --ok:#4ce8a0; --bad:#e8615c; --blue:#5cc8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
 font-family:ui-monospace,'SF Mono',Menlo,Consolas,'PingFang TC','Noto Sans TC',monospace;
 font-size:14px;line-height:1.65;padding-bottom:60px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
 background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.wrap{max-width:580px;margin:0 auto;padding:0 14px}
.hdr{border-bottom:1px solid var(--line);padding:16px 0 12px;margin-bottom:14px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{font-size:17px;letter-spacing:.14em;color:var(--gold);text-shadow:0 0 14px rgba(232,180,76,.4)}
.brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--dim);text-shadow:none;margin-top:3px}
.who{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
.who b{color:var(--gold);display:block;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:transparent;
 color:var(--dim);font:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;width:auto;font-weight:400}
.tab.on{color:var(--gold);border-color:var(--golddim);background:rgba(232,180,76,.09)}
.tab .n{display:inline-block;background:var(--gold);color:#0a0a0d;font-size:9px;border-radius:9px;
 padding:0 5px;margin-left:5px;vertical-align:1px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
 border-radius:7px;padding:11px 12px;font:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--golddim);box-shadow:0 0 0 2px rgba(232,180,76,.1)}
textarea{resize:vertical;min-height:70px}
button{width:100%;background:var(--gold);color:#0a0a0d;border:0;border-radius:8px;padding:13px;
 font:inherit;font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--golddim)}
button.dim{background:transparent;color:var(--dim);border:1px solid var(--line)}
button.sm{padding:9px;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:grid;gap:10px;margin-bottom:16px}
.pick button{text-align:left;padding:16px;line-height:1.4}
.pick .sub{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:3px;letter-spacing:0}
.sec{font-size:10px;letter-spacing:.28em;color:var(--dim);margin:22px 0 10px;
 border-bottom:1px solid var(--line);padding-bottom:7px}
.sec:first-child{margin-top:0}
.big{text-align:center;padding:22px 12px;background:
 radial-gradient(circle at 50% 0%,rgba(232,180,76,.11),transparent 70%),var(--panel)}
.big .n{font-size:36px;color:var(--gold);text-shadow:0 0 26px rgba(232,180,76,.35);line-height:1.15}
.big .l{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:6px}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:20px;border:1px solid}
.b-pending{color:var(--blue);border-color:#2a5a6a;background:rgba(92,200,232,.08)}
.b-open,.b-review{color:var(--gold);border-color:var(--golddim);background:rgba(232,180,76,.08)}
.b-settled{color:var(--ok);border-color:#2a6a4e;background:rgba(76,232,160,.08)}
.b-rejected{color:var(--bad);border-color:#6a2f2c;background:rgba(232,97,92,.08)}
.b-mute{color:var(--dim);border-color:var(--line)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item{font-size:15px}
.amt{font-size:19px;color:var(--gold);white-space:nowrap}
.amt.out{color:var(--bad)} .amt.in{color:var(--ok)}
.meta{font-size:11px;color:var(--dim);margin-top:4px}
.note{font-size:12px;background:var(--panel2);border-left:2px solid var(--golddim);
 padding:8px 10px;border-radius:0 6px 6px 0;margin-top:10px;color:#c9c9d2}
.note.bad{border-color:var(--bad)}
.thumb{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px;display:block;cursor:zoom-in}
.empty{text-align:center;color:var(--dim);padding:34px 12px;font-size:12px;line-height:2}
.msg{font-size:12px;padding:10px 12px;border-radius:7px;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.ok{background:rgba(76,232,160,.1);color:var(--ok);border:1px solid #2a6a4e}
.msg.err{background:rgba(232,97,92,.1);color:var(--bad);border:1px solid #6a2f2c}
.up{border:1px dashed var(--golddim);border-radius:8px;padding:18px;text-align:center;
 color:var(--dim);font-size:12px;cursor:pointer;background:var(--panel2)}
.up.has{border-style:solid;color:var(--ok)}
.up input{display:none}
.diff{text-align:center;padding:11px;border-radius:7px;margin-top:10px;font-size:13px}
.diff.back{background:rgba(76,232,160,.1);color:var(--ok);border:1px solid #2a6a4e}
.diff.more{background:rgba(232,180,76,.1);color:var(--gold);border:1px solid var(--golddim)}
.diff.even{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.load{text-align:center;color:var(--golddim);padding:60px 0;letter-spacing:.3em;font-size:11px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10000;display:none;
 align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">LOADING…</div></div>
<div class="lb" id="lb"><img id="lbi" src="" alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

var firebaseConfig = {
  apiKey: "AIzaSyBVyMyU1COw3BVVHNSjJSCQy-sgqE36oBE",
  authDomain: "clpb-b468b.firebaseapp.com",
  projectId: "clpb-b468b",
  storageBucket: "clpb-b468b.firebasestorage.app",
  messagingSenderId: "656673923296",
  appId: "1:656673923296:web:9138b1a2cb4e7c585d3085"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var app = document.getElementById('app');
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return 'NT$'+Number(n||0).toLocaleString('en-US'); }
function dt(ms){ if(!ms) return '—'; var d=new Date(ms);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
var LS={ get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
         set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
         del:function(k){try{localStorage.removeItem(k)}catch(e){}} };
function toast(t,bad){ var m=$('msg'); if(!m) return;
  m.className='msg on '+(bad?'err':'ok'); m.textContent=t;
  clearTimeout(toast._t); toast._t=setTimeout(function(){ m.className='msg'; },4500);
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){} }

/* SHA-256；file:// 沒有 crypto.subtle 時退回簡易雜湊（只影響本機測試） */
function hashPw(s){
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){
        return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; }
  return Promise.resolve('fb'+(h>>>0).toString(16));
}

function compress(file){
  return new Promise(function(res,rej){
    if(!file) return rej(new Error('沒有選到檔案'));
    if(!/^image\//.test(file.type)) return rej(new Error('請選圖片檔'));
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('檔案讀不到')); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ rej(new Error('圖片解析失敗')); };
      img.onload=function(){
        var w=img.width,h=img.height,MAX=1000;
        if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        var q=0.62,out=c.toDataURL('image/jpeg',q);
        while(out.length>400000&&q>0.2){ q-=0.08; out=c.toDataURL('image/jpeg',q); }
        if(out.length>700000) return rej(new Error('照片太大，靠近一點重拍'));
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

$('lb').onclick=function(){ this.className='lb'; };
window.zoom=function(s){ $('lbi').src=s; $('lb').className='lb on'; };

/* ============ 狀態 ============ */
var CFG=null, ME=null, MYREQ=[], TXN=[], TAB='mine', VIEW='list', PHOTO=null;
var ST={ pending:{t:'待審核',c:'b-pending'}, rejected:{t:'已退回',c:'b-rejected'},
         settled:{t:'已結案',c:'b-settled'}, advance_open:{t:'待補收據',c:'b-open'},
         advance_review:{t:'待確認結清',c:'b-review'} };

boot();

function boot(){
  db.collection('config').doc('main').get().then(function(d){
    if(!d.exists){ app.innerHTML='<div class="empty">系統尚未開通<br>請總務先進後台完成初始設定</div>'; return; }
    CFG=d.data();
    var saved=LS.get('clpb_uid');
    if(saved){
      db.collection('officers').doc(saved).get().then(function(o){
        if(o.exists && o.data().pw){ ME=Object.assign({id:o.id},o.data()); loadAll(); }
        else { LS.del('clpb_uid'); login(); }
      }).catch(login);
    } else login();
  }).catch(function(e){
    app.innerHTML='<div class="empty">連不上資料庫<br>'+esc(e.message)+'</div>';
  });
}

/* ============ 登入 / 綁定 ============ */
function login(){
  app.innerHTML=
    '<div class="hdr"><div class="brand">'+esc(CFG.clubName||'社費系統')+'<small>MEMBER LOGIN</small></div></div>'+
    '<div id="msg" class="msg"></div>'+
    '<div class="card">'+
      '<label>ID（自己取，英數，之後都用這個登入）</label>'+
      '<input id="lid" autocapitalize="off" autocorrect="off" placeholder="例：ricky">'+
      '<label>密碼</label><input id="lpw" type="password" placeholder="••••••">'+
      '<div style="height:14px"></div><button id="lgo">登入 / 建立帳號</button>'+
    '</div>'+
    '<div id="reg"></div>'+
    '<div class="empty">第一次進來輸入沒用過的 ID<br>會請你設定密碼並填姓名職稱<br>ID 綁定後不能重綁，忘記密碼找總務重設</div>';

  $('lgo').onclick=doLogin;
  $('lpw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}

function doLogin(){
  var id=$('lid').value.trim(), pw=$('lpw').value;
  if(!id) return toast('要輸入 ID',true);
  if(!/^[A-Za-z0-9_.-]{2,24}$/.test(id)) return toast('ID 只能用英文、數字、_ - .（2～24 字）',true);
  if(!pw) return toast('要輸入密碼',true);
  if(pw.length<4) return toast('密碼至少 4 碼',true);

  var btn=$('lgo'); btn.disabled=true; btn.textContent='處理中…';
  function reset(){ btn.disabled=false; btn.textContent='登入 / 建立帳號'; }

  db.collection('officers').doc(id).get().then(function(s){
    if(!s.exists){
      reset();
      if(CFG.openReg===false) return toast('這個 ID 不存在，而且總務已關閉新帳號註冊',true);
      return showReg(id,pw);
    }
    var d=s.data();
    if(!d.pw){ reset(); return rebind(id,pw,d); }
    return hashPw(pw).then(function(h){
      if(h!==d.pw){ reset(); return toast('密碼不對',true); }
      ME=Object.assign({id:id},d); LS.set('clpb_uid',id); loadAll();
    });
  }).catch(function(e){ reset(); toast(e.message,true); });
}

function showReg(id,pw){
  $('reg').innerHTML=
    '<div class="card" style="border-color:var(--golddim)">'+
      '<div class="sec" style="margin-top:0">建立新帳號 · '+esc(id)+'</div>'+
      '<div class="note">這個 ID 還沒人用。填完就綁定，之後不能改 ID、也不能重綁密碼。</div>'+
      '<label>姓名（大家看帳目時會看到）</label><input id="rn" placeholder="陳睿騏">'+
      '<label>職稱</label><input id="rr" placeholder="社長 / 副社 / 器材 / 總務…">'+
      '<div style="height:14px"></div>'+
      '<div class="g2"><button id="rgo" class="sm">確認建立</button>'+
      '<button id="rno" class="sm dim">取消</button></div>'+
    '</div>';
  try{ $('reg').scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}

  $('rno').onclick=function(){ $('reg').innerHTML=''; };
  $('rgo').onclick=function(){
    var n=$('rn').value.trim(), r=$('rr').value.trim();
    if(!n) return toast('要填姓名',true);
    if(!r) return toast('要填職稱',true);
    var b=this; b.disabled=true; b.textContent='建立中…';
    hashPw(pw).then(function(h){
      return db.collection('officers').doc(id).set({
        name:n, role:r, pw:h, createdAt:Date.now()
      });
    }).then(function(){
      ME={ id:id, name:n, role:r }; LS.set('clpb_uid',id); loadAll();
      setTimeout(function(){ toast('帳號建好了，'+n+' 歡迎'); },300);
    }).catch(function(e){ b.disabled=false; b.textContent='確認建立'; toast(e.message,true); });
  };
}

function rebind(id,pw,d){
  $('reg').innerHTML=
    '<div class="card" style="border-color:var(--golddim)">'+
      '<div class="sec" style="margin-top:0">重新綁定密碼</div>'+
      '<div class="note">總務重設了 '+esc(d.name||id)+' 的密碼，用剛剛輸入的那組重新綁定。</div>'+
      '<div style="height:12px"></div>'+
      '<div class="g2"><button id="rbgo" class="sm">確認綁定</button>'+
      '<button id="rbno" class="sm dim">取消</button></div>'+
    '</div>';
  $('rbno').onclick=function(){ $('reg').innerHTML=''; };
  $('rbgo').onclick=function(){
    var b=this; b.disabled=true;
    hashPw(pw).then(function(h){
      return db.collection('officers').doc(id).update({ pw:h });
    }).then(function(){
      ME=Object.assign({id:id},d); LS.set('clpb_uid',id); loadAll();
    }).catch(function(e){ b.disabled=false; toast(e.message,true); });
  };
}

/* ============ 載入 ============ */
function loadAll(){
  app.innerHTML='<div class="load">LOADING…</div>';
  Promise.all([
    db.collection('requests').get(),
    db.collection('txns').get(),
    db.collection('config').doc('main').get()
  ]).then(function(r){
    var all=[]; r[0].forEach(function(d){ all.push(Object.assign({id:d.id},d.data())); });
    MYREQ=all.filter(function(x){ return x.officerId===ME.id; })
             .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    TXN=[]; r[1].forEach(function(d){ TXN.push(Object.assign({id:d.id},d.data())); });
    TXN.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    if(r[2].exists) CFG=r[2].data();
    render();
  }).catch(function(e){
    app.innerHTML='<div class="empty">讀取失敗<br>'+esc(e.message)+'</div>';
  });
}

/* ============ 外殼 ============ */
function render(){
  var todo=MYREQ.filter(function(r){ return r.status==='advance_open'; }).length;
  app.innerHTML=
    '<div class="hdr">'+
      '<div class="brand">'+esc(CFG.clubName||'社費系統')+
        '<small>'+esc(CFG.semester||'MEMBER')+'</small></div>'+
      '<div class="who"><b>'+esc(ME.name)+'</b>'+esc(ME.role||'')+
        ' · <a href="#" id="out" style="color:var(--dim)">登出</a></div>'+
    '</div>'+
    '<div class="tabs">'+
      '<button class="tab'+(TAB==='mine'?' on':'')+'" data-t="mine">我的申請'+
        (todo?'<span class="n">'+todo+'</span>':'')+'</button>'+
      '<button class="tab'+(TAB==='book'?' on':'')+'" data-t="book">社團帳目</button>'+
    '</div>'+
    '<div id="msg" class="msg"></div><div id="body"></div>';

  $('out').onclick=function(e){ e.preventDefault(); LS.del('clpb_uid'); ME=null; VIEW='list'; TAB='mine'; login(); };
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.onclick=function(){ TAB=b.dataset.t; VIEW='list'; PHOTO=null; render(); };
  });

  if(TAB==='book') return vBook();
  if(VIEW==='claim')   return vForm('claim');
  if(VIEW==='advance') return vForm('advance');
  vMine();
}

/* ============ 我的申請 ============ */
function vMine(){
  var todo=MYREQ.filter(function(r){ return r.status==='advance_open'; });
  var rest=MYREQ.filter(function(r){ return r.status!=='advance_open'; });

  var h='<div class="pick">'+
    '<button id="bClaim">核銷申請<span class="sub">我已經先付錢了，附收據跟總務請款</span></button>'+
    '<button id="bAdv" class="ghost">預支申請<span class="sub">還沒買，先跟總務領錢，事後補收據</span></button>'+
    '</div>';

  if(todo.length) h+='<div class="sec">待你補收據 · '+todo.length+'</div>'+todo.map(myCard).join('');

  h+='<div class="sec">我的申請紀錄</div>';
  h+= rest.length ? rest.map(myCard).join('') : '<div class="empty">還沒有任何申請<br>上面挑一個開始</div>';

  $('body').innerHTML=h;
  $('bClaim').onclick=function(){ VIEW='claim';   PHOTO=null; render(); };
  $('bAdv').onclick  =function(){ VIEW='advance'; PHOTO=null; render(); };
  bindMy();
}

function myCard(r){
  var st=ST[r.status]||ST.pending;
  var kind=r.kind==='advance'?'預支':'核銷';
  var show=(r.status==='settled'||r.status==='advance_review')
           ?(r.actualAmount!=null?r.actualAmount:r.approvedAmount)
           :(r.approvedAmount!=null?r.approvedAmount:r.amount);

  var h='<div class="card"><div class="row">'+
      '<div><div class="item">'+esc(r.item)+'</div>'+
        '<div class="meta">'+kind+' · '+dt(r.createdAt)+'</div></div>'+
      '<div style="text-align:right"><div class="amt">'+money(show)+'</div>'+
        '<div style="margin-top:5px"><span class="badge '+st.c+'">'+st.t+'</span></div></div>'+
    '</div>';

  if(r.reason) h+='<div class="meta" style="margin-top:8px">'+esc(r.reason)+'</div>';
  if(r.status==='rejected') h+='<div class="note bad">總務退回：'+esc(r.adminNote||'未填原因')+'</div>';
  if(r.approvedAmount!=null && Number(r.approvedAmount)!==Number(r.amount) && r.status!=='rejected')
    h+='<div class="note">申請 '+money(r.amount)+'，核准 '+money(r.approvedAmount)+
       (r.adminNote?'（'+esc(r.adminNote)+'）':'')+'</div>';

  if(r.status==='advance_open'){
    h+='<hr><label>實際花了多少</label>'+
      '<input type="tel" inputmode="numeric" class="fAct" data-id="'+r.id+'" placeholder="收據上的總金額">'+
      '<div class="dOut" data-id="'+r.id+'"></div>'+
      '<label>收據照片</label>'+
      '<div class="up fUp" data-id="'+r.id+'">點這裡拍照或選圖<input type="file" accept="image/*"></div>'+
      '<div style="height:12px"></div>'+
      '<button class="fSend" data-id="'+r.id+'">送出核銷</button>';
  }
  if(r.status==='advance_review') h+='<div class="note">收據已送出，等總務確認結清</div>';
  if(r.receipt) h+='<img class="thumb" src="'+r.receipt+'" onclick="zoom(this.src)" alt="收據">';
  return h+'</div>';
}

function bindMy(){
  var store={};
  Array.prototype.forEach.call(document.querySelectorAll('.fUp'),function(box){
    var id=box.dataset.id, inp=box.querySelector('input');
    box.onclick=function(){ inp.click(); };
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      box.textContent='壓縮中…';
      compress(f).then(function(d){
        store[id]=store[id]||{}; store[id].photo=d;
        box.innerHTML='✓ 收據已就緒（點可重選）'; box.className='up fUp has'; box.appendChild(inp);
      }).catch(function(e){
        box.textContent='點這裡拍照或選圖'; box.appendChild(inp); toast(e.message,true);
      });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.fAct'),function(inp){
    var id=inp.dataset.id, req=MYREQ.filter(function(r){ return r.id===id; })[0];
    inp.oninput=function(){
      var out=document.querySelector('.dOut[data-id="'+id+'"]'), act=Number(inp.value);
      if(!inp.value||isNaN(act)||act<0){ out.innerHTML=''; return; }
      var got=Number(req.approvedAmount!=null?req.approvedAmount:req.amount), d=got-act;
      if(d>0)      out.innerHTML='<div class="diff back">要退回總務 '+money(d)+'</div>';
      else if(d<0) out.innerHTML='<div class="diff more">總務要再補你 '+money(-d)+'</div>';
      else         out.innerHTML='<div class="diff even">剛好用完，不用找補</div>';
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.fSend'),function(btn){
    btn.onclick=function(){
      var id=btn.dataset.id;
      var el=document.querySelector('.fAct[data-id="'+id+'"]');
      var act=Number(el?el.value:0), photo=(store[id]||{}).photo;
      if(!act||isNaN(act)||act<=0) return toast('要填實際金額',true);
      if(!photo) return toast('要附收據照片',true);
      btn.disabled=true; btn.textContent='送出中…';
      db.collection('requests').doc(id).update({
        actualAmount:act, receipt:photo, status:'advance_review', receiptAt:Date.now()
      }).then(function(){ loadAll(); setTimeout(function(){ toast('收據已送出，等總務確認'); },300); })
        .catch(function(e){ btn.disabled=false; btn.textContent='送出核銷'; toast(e.message,true); });
    };
  });
}

/* ============ 申請表單 ============ */
function vForm(kind){
  var isAdv=kind==='advance';
  var h='<div class="sec">'+(isAdv?'預支申請 · 先領錢':'核銷申請 · 我已墊付')+'</div>'+
    '<div class="card">'+
      '<label>買什麼 / 做什麼</label>'+
      '<input id="fItem" placeholder="'+(isAdv?'例：社課用巧克粉 ×3':'例：手套一雙')+'">'+
      '<label>'+(isAdv?'預估金額':'實付金額')+'</label>'+
      '<input id="fAmt" type="tel" inputmode="numeric" placeholder="只填數字">'+
      '<label>用途說明</label>'+
      '<textarea id="fWhy" placeholder="'+(isAdv?'要買什麼、為什麼需要、大概什麼時候買':'為什麼要買、用在哪裡')+'"></textarea>';

  if(isAdv) h+='<div class="note">領到錢買完之後，回「我的申請」補收據跟實際金額，多退少補。</div>';
  else h+='<label>收據照片（必附）</label>'+
    '<div class="up" id="fBox">點這裡拍照或選圖<input type="file" id="fFile" accept="image/*"></div>';

  h+='<div style="height:16px"></div><button id="fGo">送出申請</button>'+
     '<div style="height:8px"></div><button id="fBack" class="dim">取消</button></div>';

  $('body').innerHTML=h;
  $('fBack').onclick=function(){ VIEW='list'; PHOTO=null; render(); };

  if(!isAdv){
    var box=$('fBox'), file=$('fFile');
    box.onclick=function(){ file.click(); };
    file.onchange=function(){
      var f=file.files[0]; if(!f) return;
      box.textContent='壓縮中…';
      compress(f).then(function(d){
        PHOTO=d; box.innerHTML='✓ 收據已就緒（點可重選）'; box.className='up has'; box.appendChild(file);
      }).catch(function(e){
        PHOTO=null; box.textContent='點這裡拍照或選圖'; box.className='up'; box.appendChild(file);
        toast(e.message,true);
      });
    };
  }

  $('fGo').onclick=function(){
    var item=$('fItem').value.trim(), amt=Number($('fAmt').value), why=$('fWhy').value.trim();
    if(!item) return toast('要填買什麼',true);
    if(!amt||isNaN(amt)||amt<=0) return toast('金額要填數字',true);
    if(!why) return toast('要寫用途，總務才知道要不要准',true);
    if(!isAdv&&!PHOTO) return toast('核銷一定要附收據',true);

    var btn=this; btn.disabled=true; btn.textContent='送出中…';
    db.collection('requests').add({
      officerId:ME.id, officerName:ME.name, role:ME.role||'',
      kind:kind, item:item, amount:amt, reason:why,
      receipt:isAdv?null:PHOTO, status:'pending',
      approvedAmount:null, actualAmount:null, adminNote:'', createdAt:Date.now()
    }).then(function(){
      PHOTO=null; VIEW='list'; loadAll();
      setTimeout(function(){ toast('申請已送出，等總務審核'); },300);
    }).catch(function(e){
      btn.disabled=false; btn.textContent='送出申請'; toast('送出失敗：'+e.message,true);
    });
  };
}

/* ============ 社團帳目（唯讀） ============ */
function vBook(){
  var inc=0, exp=0;
  TXN.forEach(function(t){
    if(t.type==='income') inc+=Number(t.amount||0); else exp+=Number(t.amount||0);
  });
  var carry=Number(CFG.carryOver||0), bal=carry+inc-exp;

  var h='<div class="card big"><div class="l">目前結餘</div><div class="n">'+money(bal)+'</div></div>'+
    '<div class="card">'+
      ln('期初結轉',carry,'')+ln('收入合計',inc,'in')+ln('支出合計',-exp,'out')+
      '<hr>'+ln('結餘',bal,'')+
    '</div>'+
    '<div class="note">這頁唯讀，只有總務能記帳。每筆錢誰花的、花在哪、收據長怎樣都在下面，'+
      '有疑問直接找總務對。</div>';

  h+='<div class="sec">全部收支 · '+TXN.length+' 筆</div>';
  h+= TXN.length ? TXN.map(bookCard).join('') : '<div class="empty">還沒有任何帳目</div>';

  $('body').innerHTML=h;
}

function ln(l,v,k){
  return '<div class="row" style="padding:6px 0">'+
    '<div class="meta" style="margin:0;font-size:12px">'+esc(l)+'</div>'+
    '<div class="amt'+(k?' '+k:'')+'" style="font-size:15px">'+money(v)+'</div></div>';
}

function bookCard(t){
  var out=t.type==='expense';
  var by=t.by||'總務記帳';
  var h='<div class="card"><div class="row">'+
      '<div><div class="item">'+esc(t.title)+'</div>'+
        '<div class="meta">'+esc(t.date||'')+' · '+esc(t.category||'')+
          (t.note?' · '+esc(t.note):'')+'</div>'+
        '<div style="margin-top:6px"><span class="badge b-mute">'+esc(by)+'</span></div></div>'+
      '<div class="amt '+(out?'out':'in')+'">'+(out?'−':'+')+money(t.amount).replace('NT$','')+'</div>'+
    '</div>';
  if(t.receipt) h+='<img class="thumb" src="'+t.receipt+'" onclick="zoom(this.src)" alt="收據">';
  else if(out) h+='<div class="meta" style="margin-top:8px">（這筆沒有收據）</div>';
  return h+'</div>';
}

})();
</script>
