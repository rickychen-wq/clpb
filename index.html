<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07070a">
<title>社費系統</title>
<style>
:root{
  --bg:#07070a; --panel:#101016; --panel2:#181820; --line:#2a2a35;
  --gold:#e8b44c; --gold2:#f5d189; --golddim:#8a6926; --txt:#ececf2; --dim:#8b8b98;
  --ok:#4ce8a0; --bad:#f0706b; --blue:#6cd0f0;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'PingFang TC','Noto Sans TC',monospace;
  font-size:16px; line-height:1.7; min-height:100vh;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
/* CRT + 暈影 */
body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
body::after{content:'';position:fixed;inset:0;z-index:9997;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

/* 動畫 */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes sweep{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,208,240,.5)}70%{box-shadow:0 0 0 7px rgba(108,208,240,0)}}
.anim{animation:rise .42s cubic-bezier(.22,.9,.28,1) both}

.hdr{border-bottom:1px solid var(--line);padding:18px 0 14px;margin-bottom:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:20px;letter-spacing:.13em;color:var(--gold);
  text-shadow:0 0 18px rgba(232,180,76,.45)}
.brand small{display:block;font-size:11px;letter-spacing:.32em;color:var(--dim);
  text-shadow:none;margin-top:4px}
.who{font-size:13px;color:var(--dim);text-align:right;line-height:1.5}
.who b{color:var(--gold);display:block;font-size:16px;letter-spacing:.03em}
.who a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
label{display:block;font-size:11px;letter-spacing:.22em;color:var(--dim);margin:16px 0 7px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:14px 14px;font:inherit;font-size:17px;outline:none;
  transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{
  border-color:var(--golddim);box-shadow:0 0 0 3px rgba(232,180,76,.13)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
button{
  width:100%;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0a0a0d;
  border:0;border-radius:11px;padding:16px;font:inherit;font-size:17px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;min-height:52px;
  transition:transform .12s,box-shadow .2s,opacity .2s;
  box-shadow:0 3px 16px rgba(232,180,76,.16)}
button:active{transform:scale(.975);box-shadow:0 1px 6px rgba(232,180,76,.3)}
button:disabled{opacity:.35;box-shadow:none}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--golddim);box-shadow:none}
button.dim{background:transparent;color:var(--dim);border:1px solid var(--line);box-shadow:none}
button.sm{padding:12px;font-size:15px;min-height:46px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Grid 子元素預設 min-width:auto 會被內容撐爆，必須歸零 */
.g2>*,.g3>*{min-width:0}
input[type=date]{font-size:15px;padding:14px 10px}
.row>div:first-child{flex:1;min-width:0}
.item{word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* 8 號球 */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero{display:flex;justify-content:center;padding:6px 0 18px}
.hero svg{width:132px;height:132px;animation:float 4.5s ease-in-out infinite;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}

.pick{display:grid;gap:12px;margin-bottom:18px}
.pick button{text-align:left;padding:20px;line-height:1.45;font-size:18px}
.pick .sub{display:block;font-size:13px;font-weight:400;opacity:.72;margin-top:5px;letter-spacing:0}

.sec{font-size:11px;letter-spacing:.3em;color:var(--dim);margin:26px 0 12px;
  border-bottom:1px solid var(--line);padding-bottom:9px}
.sec:first-child{margin-top:0}

/* 結餘 */
.big{position:relative;text-align:center;padding:30px 16px;overflow:hidden;
  background:var(--panel);border:1px solid var(--golddim)}
.big::before{content:'';position:absolute;left:50%;top:-60%;width:150%;height:170%;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(232,180,76,.16),transparent 62%);
  animation:glow 5s ease-in-out infinite}
.big .l{position:relative;font-size:11px;letter-spacing:.34em;color:var(--dim);margin-bottom:10px}
.big .n{position:relative;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--gold) 20%,#fff2d0 50%,var(--gold) 80%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:sweep 6s linear infinite}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 8px;text-align:center}
.stat .n{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:11px;letter-spacing:.12em;color:var(--dim);margin-top:4px}

.badge{display:inline-block;font-size:12px;letter-spacing:.08em;padding:4px 11px;
  border-radius:20px;border:1px solid;white-space:nowrap}
.b-pending{color:var(--blue);border-color:#2f6478;background:rgba(108,208,240,.1);animation:pulse 2.4s infinite}
.b-open,.b-review{color:var(--gold);border-color:var(--golddim);background:rgba(232,180,76,.1)}
.b-settled{color:var(--ok);border-color:#2f7355;background:rgba(76,232,160,.1)}
.b-rejected{color:var(--bad);border-color:#75342f;background:rgba(240,112,107,.1)}
.b-mute{color:var(--dim);border-color:var(--line)}

.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item{font-size:18px;line-height:1.4}
.amt{font-size:24px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.out{color:var(--bad)} .amt.in{color:var(--ok)}
.meta{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.55}
.note{font-size:14px;background:var(--panel2);border-left:3px solid var(--golddim);
  padding:11px 13px;border-radius:0 8px 8px 0;margin-top:12px;color:#cfcfd8;line-height:1.6}
.note.bad{border-color:var(--bad)}
.thumb{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:12px;
  display:block;cursor:zoom-in;transition:border-color .2s}
.thumb:active{border-color:var(--golddim)}
.empty{text-align:center;color:var(--dim);padding:44px 16px;font-size:14px;line-height:2.1}

.msg{font-size:14px;padding:13px 15px;border-radius:10px;margin-bottom:14px;display:none}
.msg.on{display:block;animation:drop .3s cubic-bezier(.22,.9,.28,1) both}
.msg.ok{background:rgba(76,232,160,.12);color:var(--ok);border:1px solid #2f7355}
.msg.err{background:rgba(240,112,107,.12);color:var(--bad);border:1px solid #75342f}

.up{border:2px dashed var(--golddim);border-radius:12px;padding:24px 16px;text-align:center;
  color:var(--dim);font-size:14px;cursor:pointer;background:var(--panel2);
  transition:border-color .2s,color .2s,background .2s}
.up:active{background:#1e1e28}
.up.has{border-style:solid;border-color:#2f7355;color:var(--ok);
  background:rgba(76,232,160,.07);animation:pop .3s cubic-bezier(.3,1.4,.5,1) both}
.up input{display:none}
.up2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up2>.up{margin:0;padding:20px 10px;font-size:14px}
.uphint{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.6;text-align:center}


.diff{text-align:center;padding:14px;border-radius:10px;margin-top:12px;font-size:16px;
  animation:pop .26s ease both}
.diff.back{background:rgba(76,232,160,.12);color:var(--ok);border:1px solid #2f7355}
.diff.more{background:rgba(232,180,76,.12);color:var(--gold);border:1px solid var(--golddim)}
.diff.even{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}

.load{text-align:center;color:var(--golddim);padding:70px 0;letter-spacing:.35em;font-size:13px;
  animation:glow 1.4s ease-in-out infinite}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* 底部導覽 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:flex;
  background:rgba(10,10,14,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:transparent;border:0;box-shadow:none;color:var(--dim);
  font-size:14px;font-weight:400;letter-spacing:.06em;padding:12px 4px;min-height:auto;
  border-radius:10px;position:relative}
.nav button.on{color:var(--gold);background:rgba(232,180,76,.1)}
.nav .n{display:inline-block;background:var(--gold);color:#0a0a0d;font-size:11px;
  border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:1px}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:10000;display:none;
  align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex;animation:pop .22s ease both}
.lb img{max-width:100%;max-height:100%;border-radius:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .big .n{-webkit-text-fill-color:var(--gold);background:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">LOADING…</div></div>
<div class="lb" id="lb"><img id="lbi" src="" alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

var firebaseConfig = {
  apiKey: "AIzaSyBVyMyU1COw3BVVHNSjJSCQy-sgqE36oBE",
  authDomain: "clpb-b468b.firebaseapp.com",
  projectId: "clpb-b468b",
  storageBucket: "clpb-b468b.firebasestorage.app",
  messagingSenderId: "656673923296",
  appId: "1:656673923296:web:9138b1a2cb4e7c585d3085"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var app = document.getElementById('app');
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return 'NT$'+Number(n||0).toLocaleString('en-US'); }
function dt(ms){ if(!ms) return '—'; var d=new Date(ms);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
var LS={ get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
         set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
         del:function(k){try{localStorage.removeItem(k)}catch(e){}} };
function reduced(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

function toast(t,bad){ var m=$('msg'); if(!m) return;
  m.className='msg'; void m.offsetWidth;
  m.className='msg on '+(bad?'err':'ok'); m.textContent=t;
  clearTimeout(toast._t); toast._t=setTimeout(function(){ m.className='msg'; },4500);
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){} }

/* 進場：子元素依序浮上 */
function anim(sel){
  var box=$(sel||'body'); if(!box) return;
  if(reduced()) return;
  Array.prototype.forEach.call(box.children,function(el,i){
    if(i>13) return;
    el.classList.add('anim');
    el.style.animationDelay=(i*45)+'ms';
  });
}
/* 數字滾動 */
function countUp(el,to){
  if(!el) return;
  if(reduced()){ el.textContent=money(to); return; }
  var t0=null, D=850;
  function step(t){
    if(t0===null) t0=t;
    var p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3);
    el.textContent=money(Math.round(to*e));
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function hashPw(s){
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){
        return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; }
  return Promise.resolve('fb'+(h>>>0).toString(16));
}

function loadHeic(){
  if(window.heic2any) return Promise.resolve(true);
  if(loadHeic._p) return loadHeic._p;
  loadHeic._p=new Promise(function(res){
    var done=false;
    var t=setTimeout(function(){ if(!done){ done=true; res(false); } },15000);
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    sc.onload=function(){ if(!done){ done=true; clearTimeout(t); res(!!window.heic2any); } };
    sc.onerror=function(){ if(!done){ done=true; clearTimeout(t); res(false); } };
    document.head.appendChild(sc);
  });
  return loadHeic._p;
}

var HEIC_TIP='HEIC 格式轉檔失敗。到「相機 → 進階拍攝選項」把「高效率格式」關掉重拍，'+
  '或先把照片傳給自己的 LINE 再存下來，格式就會變成一般的 JPG';

/* 先處理格式（HEIC 轉 JPEG），再縮圖壓縮 */
function compress(file){
  if(!file) return Promise.reject(new Error('沒有選到檔案'));
  var nm=(file.name||'').toLowerCase();
  var heic=/\.(heic|heif)$/.test(nm) || /hei[cf]/.test(file.type||'');
  if(!/^image\//.test(file.type) && !heic)
    return Promise.reject(new Error('請選圖片檔'));

  if(!heic) return shrink(file,false);

  return loadHeic().then(function(ok){
    if(!ok) throw new Error(HEIC_TIP);
    return window.heic2any({ blob:file, toType:'image/jpeg', quality:0.85 });
  }).then(function(out){
    return shrink(Array.isArray(out)?out[0]:out, true);
  }).catch(function(e){
    throw new Error(e && e.message === HEIC_TIP ? HEIC_TIP : HEIC_TIP);
  });
}

function shrink(blob,wasHeic){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('檔案讀不到，換一張試試')); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){
        rej(new Error(wasHeic ? HEIC_TIP
          : '這張圖解不開，可能是特殊格式。用手機截圖一張再上傳就會過'));
      };
      img.onload=function(){
        var w=img.width,h=img.height,MAX=1000;
        if(!w||!h) return rej(new Error('圖片尺寸讀不到，換一張試試'));
        if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        var q=0.62,out;
        try{ out=c.toDataURL('image/jpeg',q); }
        catch(e){ return rej(new Error('照片太大，手機處理不動。用截圖或調低相機解析度')); }
        while(out.length>400000&&q>0.2){ q-=0.08; out=c.toDataURL('image/jpeg',q); }
        if(out.length>700000) return rej(new Error('照片太大，請靠近一點重拍'));
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(blob);
  });
}

$('lb').onclick=function(){ this.className='lb'; };
window.zoom=function(s){ $('lbi').src=s; $('lb').className='lb on'; };

/* ============ 狀態 ============ */
var CFG=null, ME=null, MYREQ=[], TXN=[], TAB='mine', VIEW='list', PHOTO=null;
var ST={ pending:{t:'待審核',c:'b-pending'}, rejected:{t:'已退回',c:'b-rejected'},
         settled:{t:'已結案',c:'b-settled'}, advance_open:{t:'待補收據',c:'b-open'},
         advance_review:{t:'待確認結清',c:'b-review'} };

boot();

function boot(){
  db.collection('config').doc('main').get().then(function(d){
    if(!d.exists){ app.innerHTML='<div class="empty">系統尚未開通<br>請總務先進後台完成初始設定</div>'; return; }
    CFG=d.data();
    var saved=LS.get('clpb_uid');
    if(saved){
      db.collection('officers').doc(saved).get().then(function(o){
        if(o.exists && o.data().pw){ ME=Object.assign({id:o.id},o.data()); loadAll(); }
        else { LS.del('clpb_uid'); login(); }
      }).catch(login);
    } else login();
  }).catch(function(e){
    app.innerHTML='<div class="empty">連不上資料庫<br>'+esc(e.message)+'</div>';
  });
}

/* ============ 登入 ============ */
function login(){
  app.innerHTML=
    '<div class="hdr"><div class="brand">'+esc(CFG.clubName||'社費系統')+'<small>MEMBER LOGIN</small></div></div>'+
    '<div id="msg" class="msg"></div>'+
    '<div id="body">'+
      '<div class="card">'+
        '<label>ID（自己取，英數，之後都用這個登入）</label>'+
        '<input id="lid" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：a0912">'+
        '<label>密碼</label><input id="lpw" type="password" placeholder="至少 4 碼">'+
        '<div style="height:16px"></div><button id="lgo">登入 / 建立帳號</button>'+
      '</div>'+
      '<div id="reg"></div>'+
      '<div class="empty">第一次進來輸入沒用過的 ID<br>會請你設定密碼並填姓名職稱<br>'+
        'ID 綁定後不能重綁，忘記密碼找總務重設</div>'+
    '</div>';
  anim('body');
  $('lgo').onclick=doLogin;
  $('lpw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}

function doLogin(){
  var id=$('lid').value.trim(), pw=$('lpw').value;
  if(!id) return toast('要輸入 ID',true);
  if(!/^[A-Za-z0-9_.-]{2,24}$/.test(id)) return toast('ID 只能用英文、數字、_ - .（2～24 字）',true);
  if(!pw) return toast('要輸入密碼',true);
  if(pw.length<4) return toast('密碼至少 4 碼',true);

  var btn=$('lgo'); btn.disabled=true; btn.textContent='處理中…';
  function reset(){ btn.disabled=false; btn.textContent='登入 / 建立帳號'; }

  db.collection('officers').doc(id).get().then(function(s){
    if(!s.exists){
      reset();
      if(CFG.openReg===false) return toast('這個 ID 不存在，而且總務已關閉新帳號註冊',true);
      return showReg(id,pw);
    }
    var d=s.data();
    if(!d.pw){ reset(); return rebind(id,pw,d); }
    return hashPw(pw).then(function(h){
      if(h!==d.pw){ reset(); return toast('密碼不對',true); }
      ME=Object.assign({id:id},d); LS.set('clpb_uid',id); loadAll();
    });
  }).catch(function(e){ reset(); toast(e.message,true); });
}

function showReg(id,pw){
  $('reg').innerHTML=
    '<div class="card" style="border-color:var(--golddim);animation:pop .3s ease both">'+
      '<div class="sec" style="margin-top:0">建立新帳號 · '+esc(id)+'</div>'+
      '<div class="note">這個 ID 還沒人用。填完就綁定，之後不能改 ID、也不能重綁密碼。</div>'+
      '<label>姓名（大家看帳目時會看到）</label><input id="rn" placeholder="填你的真名">'+
      '<label>職稱</label><input id="rr" placeholder="社長 / 副社 / 器材 / 總務…">'+
      '<div style="height:16px"></div>'+
      '<div class="g2"><button id="rgo" class="sm">確認建立</button>'+
      '<button id="rno" class="sm dim">取消</button></div>'+
    '</div>';
  try{ $('reg').scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}

  $('rno').onclick=function(){ $('reg').innerHTML=''; };
  $('rgo').onclick=function(){
    var n=$('rn').value.trim(), r=$('rr').value.trim();
    if(!n) return toast('要填姓名',true);
    if(!r) return toast('要填職稱',true);
    var b=this; b.disabled=true; b.textContent='建立中…';
    hashPw(pw).then(function(h){
      return db.collection('officers').doc(id).set({ name:n, role:r, pw:h, createdAt:Date.now() });
    }).then(function(){
      ME={ id:id, name:n, role:r }; LS.set('clpb_uid',id); loadAll();
      setTimeout(function(){ toast('帳號建好了，'+n+' 歡迎'); },350);
    }).catch(function(e){ b.disabled=false; b.textContent='確認建立'; toast(e.message,true); });
  };
}

function rebind(id,pw,d){
  $('reg').innerHTML=
    '<div class="card" style="border-color:var(--golddim);animation:pop .3s ease both">'+
      '<div class="sec" style="margin-top:0">重新綁定密碼</div>'+
      '<div class="note">總務重設了 '+esc(d.name||id)+' 的密碼，用剛剛輸入的那組重新綁定。</div>'+
      '<div style="height:16px"></div>'+
      '<div class="g2"><button id="rbgo" class="sm">確認綁定</button>'+
      '<button id="rbno" class="sm dim">取消</button></div>'+
    '</div>';
  $('rbno').onclick=function(){ $('reg').innerHTML=''; };
  $('rbgo').onclick=function(){
    var b=this; b.disabled=true;
    hashPw(pw).then(function(h){ return db.collection('officers').doc(id).update({ pw:h }); })
      .then(function(){ ME=Object.assign({id:id},d); LS.set('clpb_uid',id); loadAll(); })
      .catch(function(e){ b.disabled=false; toast(e.message,true); });
  };
}

/* ============ 載入 ============ */
function loadAll(){
  app.innerHTML='<div class="load">LOADING…</div>';
  Promise.all([
    db.collection('requests').get(),
    db.collection('txns').get(),
    db.collection('config').doc('main').get()
  ]).then(function(r){
    var all=[]; r[0].forEach(function(d){ all.push(Object.assign({id:d.id},d.data())); });
    MYREQ=all.filter(function(x){ return x.officerId===ME.id; })
             .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    TXN=[]; r[1].forEach(function(d){ TXN.push(Object.assign({id:d.id},d.data())); });
    TXN.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    if(r[2].exists) CFG=r[2].data();
    render();
  }).catch(function(e){
    app.innerHTML='<div class="empty">讀取失敗<br>'+esc(e.message)+'</div>';
  });
}

/* ============ 外殼 ============ */
function render(){
  var todo=MYREQ.filter(function(r){ return r.status==='advance_open'; }).length;

  app.innerHTML=
    '<div class="hdr">'+
      '<div class="brand">'+esc(CFG.clubName||'社費系統')+
        '<small>'+esc(CFG.semester||'MEMBER')+'</small></div>'+
      '<div class="who"><b>'+esc(ME.name)+'</b>'+esc(ME.role||'')+
        ' · <a href="#" id="out">登出</a></div>'+
    '</div>'+
    '<div id="msg" class="msg"></div><div id="body"></div>';

  var nav=document.querySelector('.nav');
  if(nav) nav.remove();
  var n=document.createElement('div');
  n.className='nav';
  n.innerHTML=
    '<button class="'+(TAB==='mine'?'on':'')+'" data-t="mine">我的申請'+
      (todo?'<span class="n">'+todo+'</span>':'')+'</button>'+
    '<button class="'+(TAB==='book'?'on':'')+'" data-t="book">社團帳目</button>';
  document.body.appendChild(n);

  $('out').onclick=function(e){
    e.preventDefault(); LS.del('clpb_uid'); ME=null; VIEW='list'; TAB='mine';
    var b=document.querySelector('.nav'); if(b) b.remove();
    login();
  };
  Array.prototype.forEach.call(n.children,function(b){
    b.onclick=function(){ TAB=b.dataset.t; VIEW='list'; PHOTO=null; render(); };
  });

  if(TAB==='book') return vBook();
  if(VIEW==='claim')   return vForm('claim');
  if(VIEW==='advance') return vForm('advance');
  vMine();
}

/* ============ 我的申請 ============ */
function vMine(){
  var todo=MYREQ.filter(function(r){ return r.status==='advance_open'; });
  var rest=MYREQ.filter(function(r){ return r.status!=='advance_open'; });

  var h='<div class="pick">'+
    '<button id="bClaim">核銷申請<span class="sub">我已經先付錢了，附收據跟總務請款</span></button>'+
    '<button id="bAdv" class="ghost">預支申請<span class="sub">還沒買，先跟總務領錢，事後補收據</span></button>'+
    '</div>';

  if(todo.length) h+='<div class="sec">待你補收據 · '+todo.length+'</div>'+todo.map(myCard).join('');
  h+='<div class="sec">我的申請紀錄</div>';
  h+= rest.length ? rest.map(myCard).join('') : '<div class="empty">還沒有任何申請<br>上面挑一個開始</div>';

  $('body').innerHTML=h;
  anim('body');
  $('bClaim').onclick=function(){ VIEW='claim';   PHOTO=null; render(); };
  $('bAdv').onclick  =function(){ VIEW='advance'; PHOTO=null; render(); };
  bindMy();
}

function myCard(r){
  var st=ST[r.status]||ST.pending;
  var kind=r.kind==='advance'?'預支':'核銷';
  var show=(r.status==='settled'||r.status==='advance_review')
           ?(r.actualAmount!=null?r.actualAmount:r.approvedAmount)
           :(r.approvedAmount!=null?r.approvedAmount:r.amount);

  var h='<div class="card"><div class="row">'+
      '<div><div class="item">'+esc(r.item)+'</div>'+
        '<div class="meta">'+kind+' · '+dt(r.createdAt)+'</div></div>'+
      '<div style="text-align:right"><div class="amt">'+money(show)+'</div>'+
        '<div style="margin-top:7px"><span class="badge '+st.c+'">'+st.t+'</span></div></div>'+
    '</div>';

  if(r.reason) h+='<div class="meta">'+esc(r.reason)+'</div>';
  if(r.status==='rejected') h+='<div class="note bad">總務退回：'+esc(r.adminNote||'未填原因')+'</div>';
  if(r.approvedAmount!=null && Number(r.approvedAmount)!==Number(r.amount) && r.status!=='rejected')
    h+='<div class="note">申請 '+money(r.amount)+'，核准 '+money(r.approvedAmount)+
       (r.adminNote?'（'+esc(r.adminNote)+'）':'')+'</div>';

  if(r.status==='advance_open'){
    h+='<hr><label>實際花了多少</label>'+
      '<input type="tel" inputmode="numeric" class="fAct" data-id="'+r.id+'" placeholder="收據上的總金額">'+
      '<div class="dOut" data-id="'+r.id+'"></div>'+
      '<label>收據照片</label>'+
      '<div class="up2">'+
        '<div class="up fUp" data-id="'+r.id+'">📷 拍照'+
          '<input type="file" accept="image/*" capture="environment"></div>'+
        '<div class="up fUp" data-id="'+r.id+'">🖼 從相簿選'+
          '<input type="file" accept="image/*"></div>'+
      '</div>'+
      '<div class="uphint" data-id="'+r.id+'">還沒選收據</div>'+
      '<div style="height:14px"></div>'+
      '<button class="fSend" data-id="'+r.id+'">送出核銷</button>';
  }
  if(r.status==='advance_review') h+='<div class="note">收據已送出，等總務確認結清</div>';
  if(r.receipt) h+='<img class="thumb" src="'+r.receipt+'" onclick="zoom(this.src)" alt="收據">';
  return h+'</div>';
}

function bindMy(){
  var store={};
  Array.prototype.forEach.call(document.querySelectorAll('.fUp'),function(box){
    var id=box.dataset.id, inp=box.querySelector('input');
    var hint=document.querySelector('.uphint[data-id="'+id+'"]');
    box.onclick=function(){ inp.click(); };
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      if(hint){ hint.textContent='處理中…（HEIC 需要幾秒）'; hint.style.color='var(--gold)'; }
      compress(f).then(function(d){
        store[id]=store[id]||{}; store[id].photo=d;
        if(hint){ hint.textContent='✓ 收據已就緒'; hint.style.color='var(--ok)'; }
      }).catch(function(e){
        store[id]=store[id]||{}; store[id].photo=null;
        if(hint){ hint.textContent='還沒選收據'; hint.style.color=''; }
        inp.value=''; toast(e.message,true);
      });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.fAct'),function(inp){
    var id=inp.dataset.id, req=MYREQ.filter(function(r){ return r.id===id; })[0];
    inp.oninput=function(){
      var out=document.querySelector('.dOut[data-id="'+id+'"]'), act=Number(inp.value);
      if(!inp.value||isNaN(act)||act<0){ out.innerHTML=''; return; }
      var got=Number(req.approvedAmount!=null?req.approvedAmount:req.amount), d=got-act;
      if(d>0)      out.innerHTML='<div class="diff back">要退回總務 '+money(d)+'</div>';
      else if(d<0) out.innerHTML='<div class="diff more">總務要再補你 '+money(-d)+'</div>';
      else         out.innerHTML='<div class="diff even">剛好用完，不用找補</div>';
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.fSend'),function(btn){
    btn.onclick=function(){
      var id=btn.dataset.id;
      var el=document.querySelector('.fAct[data-id="'+id+'"]');
      var act=Number(el?el.value:0), photo=(store[id]||{}).photo;
      if(!act||isNaN(act)||act<=0) return toast('要填實際金額',true);
      if(!photo) return toast('要附收據照片',true);
      btn.disabled=true; btn.textContent='送出中…';
      db.collection('requests').doc(id).update({
        actualAmount:act, receipt:photo, status:'advance_review', receiptAt:Date.now()
      }).then(function(){ loadAll(); setTimeout(function(){ toast('收據已送出，等總務確認'); },350); })
        .catch(function(e){ btn.disabled=false; btn.textContent='送出核銷'; toast(e.message,true); });
    };
  });
}

/* ============ 申請表單 ============ */
function vForm(kind){
  var isAdv=kind==='advance';
  var h='<div class="sec">'+(isAdv?'預支申請 · 先領錢':'核銷申請 · 我已墊付')+'</div>'+
    '<div class="card">'+
      '<label>買什麼 / 做什麼</label>'+
      '<input id="fItem" placeholder="'+(isAdv?'例：社課耗材':'例：清潔用品一組')+'">'+
      '<label>'+(isAdv?'預估金額':'實付金額')+'</label>'+
      '<input id="fAmt" type="tel" inputmode="numeric" placeholder="只填數字">'+
      '<label>用途說明</label>'+
      '<textarea id="fWhy" placeholder="'+(isAdv?'要買什麼、為什麼需要、大概什麼時候買':'為什麼要買、用在哪裡')+'"></textarea>';

  if(isAdv) h+='<div class="note">領到錢買完之後，回「我的申請」補收據跟實際金額，多退少補。</div>';
  else h+='<label>收據照片（必附）</label>'+
    '<div class="up2">'+
      '<div class="up" id="fBoxA">📷 拍照'+
        '<input type="file" id="fFileA" accept="image/*" capture="environment"></div>'+
      '<div class="up" id="fBoxB">🖼 從相簿選'+
        '<input type="file" id="fFileB" accept="image/*"></div>'+
    '</div><div class="uphint" id="fHint">還沒選收據</div>';

  h+='<div style="height:18px"></div><button id="fGo">送出申請</button>'+
     '<div style="height:10px"></div><button id="fBack" class="dim">取消</button></div>';

  $('body').innerHTML=h;
  anim('body');
  $('fBack').onclick=function(){ VIEW='list'; PHOTO=null; render(); };

  if(!isAdv){
    [['fBoxA','fFileA'],['fBoxB','fFileB']].forEach(function(pair){
      var box=$(pair[0]), file=$(pair[1]), hint=$('fHint');
      box.onclick=function(){ file.click(); };
      file.onchange=function(){
        var f=file.files[0]; if(!f) return;
        hint.textContent='處理中…（HEIC 需要幾秒）'; hint.style.color='var(--gold)';
        compress(f).then(function(d){
          PHOTO=d; hint.textContent='✓ 收據已就緒'; hint.style.color='var(--ok)';
          box.className='up has';
        }).catch(function(e){
          PHOTO=null; hint.textContent='還沒選收據'; hint.style.color='';
          box.className='up'; file.value=''; toast(e.message,true);
        });
      };
    });
  }

  $('fGo').onclick=function(){
    var item=$('fItem').value.trim(), amt=Number($('fAmt').value), why=$('fWhy').value.trim();
    if(!item) return toast('要填買什麼',true);
    if(!amt||isNaN(amt)||amt<=0) return toast('金額要填數字',true);
    if(!why) return toast('要寫用途，總務才知道要不要准',true);
    if(!isAdv&&!PHOTO) return toast('核銷一定要附收據',true);

    var btn=this; btn.disabled=true; btn.textContent='送出中…';
    db.collection('requests').add({
      officerId:ME.id, officerName:ME.name, role:ME.role||'',
      kind:kind, item:item, amount:amt, reason:why,
      receipt:isAdv?null:PHOTO, status:'pending',
      approvedAmount:null, actualAmount:null, adminNote:'', createdAt:Date.now()
    }).then(function(){
      PHOTO=null; VIEW='list'; loadAll();
      setTimeout(function(){ toast('申請已送出，等總務審核'); },350);
    }).catch(function(e){
      btn.disabled=false; btn.textContent='送出申請'; toast('送出失敗：'+e.message,true);
    });
  };
}

/* ============ 社團帳目 ============ */
function vBook(){
  var inc=0, exp=0;
  TXN.forEach(function(t){
    if(t.type==='income') inc+=Number(t.amount||0); else exp+=Number(t.amount||0);
  });
  var carry=Number(CFG.carryOver||0), bal=carry+inc-exp;

  var h='<div class="card big"><div class="l">目前結餘</div><div class="n" id="balN">NT$0</div></div>'+
    '<div class="card">'+
      ln('期初結轉',carry,'')+ln('收入合計',inc,'in')+ln('支出合計',-exp,'out')+
      '<hr>'+ln('結餘',bal,'')+'</div>'+
    '<div class="note">這頁唯讀，只有總務能記帳。每筆錢誰花的、花在哪、收據長怎樣都在下面，'+
      '有疑問直接找總務對。</div>'+
    '<div class="sec">全部收支 · '+TXN.length+' 筆</div>';
  h+= TXN.length ? TXN.map(bookCard).join('') : '<div class="empty">還沒有任何帳目</div>';

  $('body').innerHTML=h;
  anim('body');
  countUp($('balN'),bal);
}

function ln(l,v,k){
  return '<div class="row" style="padding:7px 0">'+
    '<div class="meta" style="margin:0">'+esc(l)+'</div>'+
    '<div class="amt'+(k?' '+k:'')+'" style="font-size:19px">'+money(v)+'</div></div>';
}

function bookCard(t){
  var out=t.type==='expense';
  var h='<div class="card"><div class="row">'+
      '<div><div class="item">'+esc(t.title)+'</div>'+
        '<div class="meta">'+esc(t.date||'')+' · '+esc(t.category||'')+
          (t.note?' · '+esc(t.note):'')+'</div>'+
        '<div style="margin-top:8px"><span class="badge b-mute">'+esc(t.by||'總務記帳')+'</span></div></div>'+
      '<div class="amt '+(out?'out':'in')+'">'+(out?'−':'+')+money(t.amount).replace('NT$','')+'</div>'+
    '</div>';
  if(t.receipt) h+='<img class="thumb" src="'+t.receipt+'" onclick="zoom(this.src)" alt="收據">';
  else if(out) h+='<div class="meta">（這筆沒有收據）</div>';
  return h+'</div>';
}

})();
</script>
</body>
</html>
